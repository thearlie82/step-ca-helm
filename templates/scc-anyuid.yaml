{{- if .Values.scc.anyuidServiceAccounts }}
# step-ca must run as its image UID 1000 (owns /home/step; the step-ca binary
# has a NET_BIND_SERVICE file capability that won't exec under an arbitrary
# UID). Grant the pods' ServiceAccounts the built-in anyuid SCC by binding the
# cluster role that OpenShift auto-generates for it:
# system:openshift:scc:anyuid. This keeps SCC access GitOps-managed instead of
# an out-of-band `oc adm policy add-scc-to-user`.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: step-ca-anyuid
  labels:
    app.kubernetes.io/name: step-ca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
{{- range .Values.scc.anyuidServiceAccounts }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
