# Default values. Per-environment overrides live in adt-grc-gitops:
#   environments/step-ca/<env>/values.yaml

# Hostname clients use to reach the CA. Must match a name in
# step-certificates.ca.dns below so the CA issues itself a valid leaf.
caHost: step-ca.apps.cluster.adt.network

# OpenShift Route. step-ca terminates TLS itself (it is a CA), so the route
# is PASSTHROUGH — the router forwards raw TLS to the pod on :9000. No
# externalCertificate: the CA presents its own leaf signed by its root.
route:
  enabled: true

# step-ca runs as the image's built-in UID 1000: /home/step is owned by 1000,
# and the step-ca binary carries a NET_BIND_SERVICE file capability that the
# kernel refuses to exec under an arbitrary UID + no-new-privs. So instead of
# forcing OpenShift's restricted-v2 arbitrary UID (which breaks both), grant
# the pods' ServiceAccounts the anyuid SCC — the same pattern coder uses in
# this cluster. This chart's templates/scc-anyuid.yaml binds it.
scc:
  # ServiceAccounts that need anyuid. "default" runs the CA StatefulSet pod;
  # the bootstrap job runs as the chart-created "<fullname>-config" SA.
  anyuidServiceAccounts:
    - default
    - step-ca-config

# Upstream smallstep/step-certificates values.
# See https://github.com/smallstep/helm-charts/blob/master/step-certificates/values.yaml
step-certificates:
  # Pin the resource names to "step-ca" so the Service the Route targets is
  # "step-ca" (without this the subchart appends "-step-certificates").
  fullnameOverride: step-ca

  # This cluster cannot resolve cr.smallstep.com (the chart default registry);
  # docker.io IS reachable and smallstep mirrors the images there.
  image:
    repository: docker.io/smallstep/step-ca
  bootstrap:
    enabled: true
    image:
      repository: docker.io/smallstep/step-ca-bootstrap
    # Run as UID 1000 — the owner of /home/step (mode 2755) inside the image,
    # so `step ca init` can create /home/step/{certs,secrets,db,config}.
    # Running as root instead would need CAP_DAC_OVERRIDE to write that
    # owner-only dir, but dropping ALL caps strips exactly that cap; UID 1000
    # owns the dir outright and sidesteps the whole problem.
    containerSecurityContext:
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop: ["ALL"]

  ca:
    name: "ADT Test CA"
    # DNS SANs baked into the intermediate cert. Include the in-cluster
    # service name and the external route host so both paths validate.
    dns: "step-ca.step-ca.svc.cluster.local,step-ca.apps.cluster.adt.network"
    address: ":9000"
    url: "https://step-ca.apps.cluster.adt.network"

    provisioner:
      name: admin

    # The step-ca binary carries a NET_BIND_SERVICE file capability; the
    # kernel refuses to exec a file-cap binary under no-new-privs, so
    # allowPrivilegeEscalation MUST be true here. Runs as image UID 1000
    # (owns /home/step) under anyuid.
    containerSecurityContext:
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: true
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        add: ["NET_BIND_SERVICE"]
    init:
      containerSecurityContext:
        runAsUser: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

    # Persist the CA database (issued-cert index, revocations) on a PVC so a
    # pod restart does not lose issuance history.
    db:
      enabled: true
      persistent: true
      size: 1Gi
      accessModes:
        - ReadWriteOnce
      # storageClass: ""   # cluster default

  service:
    type: ClusterIP
    port: 443
    targetPort: 9000
